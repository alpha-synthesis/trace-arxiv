[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trace-ecsde"
version = "0.1.0"
description = "Code accompanying TRACE: the ECSDE event-conditioned generator and the TRACE audit protocol for LLM-conditioned event generators."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Diego Silva Prado"},
    {name = "Bruno Caldas de Souza"},
    {name = "Tiago Amaral Penteado de Jesus"},
    {name = "Cristiano Bevitori Maffia De Oliveira"},
]
keywords = ["synthetic-data", "finance", "sde", "causal", "llm", "time-series"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Office/Business :: Financial",
]

dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "torch>=2.0",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
    "plotly>=5.15",
    "dash>=2.14",
    "litellm>=1.0",
    "requests>=2.28",
    "tqdm>=4.65",
    "chromadb>=0.4",
    "sentence-transformers>=2.2",
    "yfinance>=0.2.18",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
full = [
    "fredapi>=0.5",
    "arch>=6.0",
    "openpyxl>=3.1",
    "statsmodels>=0.14",
    "scikit-learn>=1.3",
    "iisignature>=0.24",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1",
]

[project.urls]
Repository = "https://github.com/alpha-synthesis/trace-arxiv"

[tool.setuptools.packages.find]
include = ["sde_causal_generator*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py310"
line-length = 100
